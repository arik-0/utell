name: Despliegue Automático Backend a Alwaysdata

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Permite disparar el despliegue manualmente desde la pestaña Actions en GitHub

jobs:
  web-deploy:
    name: 🚀 Sincronizar API con Alwaysdata
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Obtener código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📦 Instalar cliente lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: 📡 Sincronizar archivos por FTPS seguro
        env:
          HOST: ${{ secrets.ALWAYSDATA_FTP_SERVER }}
          USER: ${{ secrets.ALWAYSDATA_FTP_USERNAME }}
          PASS: ${{ secrets.ALWAYSDATA_FTP_PASSWORD }}
          DEST_DIR: ${{ secrets.ALWAYSDATA_FTP_PATH || 'www/' }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate no;
            set ssl:check-hostname no;
            set net:timeout 30;
            set net:max-retries 3;
            open -u \"$USER\",\"$PASS\" \"$HOST\";
            mirror --reverse --verbose \
              --exclude-glob \".git*\" \
              --exclude-glob \"node_modules/\" \
              --exclude-glob \"*.sql\" \
              --exclude-glob \".env*\" \
              --exclude-glob \"src/config/db-config.php\" \
              ./api/ \"$DEST_DIR\";
            bye;
          "
